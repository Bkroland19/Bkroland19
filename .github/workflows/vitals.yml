name: vitals

# Redraws the "vital signs" ECG from the contribution calendar and
# publishes it to the orphan `output` branch that README.md embeds.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/vitals.py
      - assets/fonts/**
      - .github/workflows/vitals.yml

permissions:
  contents: write

concurrency:
  group: vitals
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render vitals.svg
        run: python3 scripts/vitals.py --login "${{ github.repository_owner }}" --out dist/vitals.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "vitals: $(date -u +%FT%RZ)"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
